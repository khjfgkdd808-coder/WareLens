# [설정] 파일 저장 경로를 외부로 분리하여 환경 변경 시 코드 수정 없이 배포 가능
file.upload-dir=D:/warelens_uploads/

# Clip 서버 주소 (8001)
ai.clip.url=http://localhost:8001/internal/clip/recommend

# Mediapipe 서버 주소 (8002)
ai.mediapipe.url=http://localhost:8002/api/v1/analyze/body

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# [로그 설정] 내 프로젝트 패키지의 로그 레벨 설정
# 개발 중에는 DEBUG로 상세 로그를 보고, 운영 시에는 INFO로 전환하세요.
logging.level.com.example.demo=DEBUG
